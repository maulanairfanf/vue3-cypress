name: CI/CD Pipeline

on:
  push:
    branches: [main] # 🚀 Only deploy when code is merged into `main`
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Cypress Binary
        run: pnpm cypress install

      # ✅ Run Component Tests
      - name: Run Cypress Component Tests
        run: pnpm cypress run --component

      # ✅ Start Vite in the background
      - name: Start Vite
        run: pnpm run dev &
        env:
          CYPRESS_BASE_URL: 'http://localhost:5173'

      - name: Wait for App
        run: npx wait-on http://localhost:5173

      # ✅ Run E2E Tests
      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          wait-on: 'http://localhost:5173'
          browser: chrome

  deploy:
    needs: test # 🚀 Only run deployment if tests pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm run build

      - name: Deploy to Production # 🚀 Example: Deploy to Vercel
        run: pnpm dlx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
